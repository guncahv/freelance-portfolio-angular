<article class="card">
  <div class="cover">
    <img [src]="project.imageUrl" [alt]="'Обложка проекта «' + project.title + '»'" class="image" />
    <button
      type="button"
      class="favorite"
      [class.favorite-on]="isFavorite"
      [attr.aria-pressed]="isFavorite"
      [attr.aria-label]="isFavorite ? 'Убрать из избранного' : 'Добавить в избранное'"
      (click)="toggleFavorite()"
    >
      <span
        class="icon"
        [style.--icon]="isFavorite ? 'url(assets/icons/icon-heart-filled.svg)' : 'url(assets/icons/icon-heart.svg)'"
        aria-hidden="true"
      ></span>
    </button>
  </div>

  <div class="body">
    <ul class="tags" *ngIf="project.tags?.length">
      <li class="tag" *ngFor="let tag of project.tags">{{ tag }}</li>
    </ul>
    <h3 class="title">{{ project.title }}</h3>
    <p class="description">{{ project.description }}</p>
    <div class="footer">
      <a href="#" class="link">
        Смотреть кейс
        <span class="icon" style="--icon: url(assets/icons/icon-arrow-right.svg)" aria-hidden="true"></span>
      </a>
      <span class="meta" *ngIf="project.meta">{{ project.meta }}</span>
    </div>
  </div>
</article>
